        <div id="resetPasswordModal" class="permission-modal" hidden>
          <div
            class="permission-dialog password-reset-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="resetPasswordTitle"
          >
            <div class="panel-head">
              <div>
                <h2 id="resetPasswordTitle">Reset Password User</h2>
                <p id="resetPasswordUserLabel" class="hint-text"></p>
              </div>
              <button
                type="button"
                class="btn btn-ghost"
                id="resetPasswordClose"
                aria-label="Tutup"
              >
                ✕
              </button>
            </div>
            <form id="resetPasswordForm" class="login-form" autocomplete="off">
              <label class="field">
                <span>Password Baru</span>
                <input
                  type="password"
                  id="resetPasswordNew"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </label>
              <p class="hint-text">
                Minimal 8 karakter. Semua sesi user akan berakhir setelah
                password disimpan.
              </p>
              <label class="field">
                <span>Ulangi Password Baru</span>
                <input
                  type="password"
                  id="resetPasswordConfirm"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
              </label>
              <p id="resetPasswordError" class="form-error" hidden></p>
              <div class="form-actions permission-actions">
                <button
                  type="button"
                  class="btn btn-ghost"
                  id="resetPasswordCancel"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="resetPasswordSave"
                >
                  Simpan Password
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- =========================================
     MODAL ATUR AKSES USER
     ========================================= -->
        <div id="permissionModal" class="permission-modal" hidden>
          <div
            class="permission-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="permissionTitle"
          >
            <div class="panel-head">
              <div>
                <p class="eyebrow">Pengaturan User</p>
                <h2 id="permissionTitle">Atur Hak Akses</h2>
                <p
                  id="permissionUserLabel"
                  class="hint-text"
                  style="margin-top: 6px; margin-bottom: 0"
                >
                  —
                </p>
              </div>

              <button
                type="button"
                id="permissionClose"
                class="btn btn-ghost"
                title="x"
              >
                ✕
              </button>
            </div>

            <div id="permissionGrid" class="permission-grid">
              <!-- AKSES DASHBOARD -->
              <label>
                <input type="checkbox" data-permission="accessDashboard" />
                <span>
                  <strong>Akses Dashboard</strong><br />
                  <small>Dapat Membuka dan Menggunakan menu Dashboard</small>
                </span>
              </label>
              <!-- FILLING -->
              <label>
                <input type="checkbox" data-permission="accessFilling" />
                <span>
                  <strong>Akses Filling</strong><br />
                  <small>Dapat membuka dan menggunakan menu Filling.</small>
                </span>
              </label>

              <!-- PRESS -->
              <label>
                <input type="checkbox" data-permission="accessPress" />
                <span>
                  <strong>Akses Press</strong><br />
                  <small>Dapat membuka dan menggunakan menu Press.</small>
                </span>
              </label>

              <!-- APD -->
              <label>
                <input type="checkbox" data-permission="accessApd" />
                <span>
                  <strong>Akses APD</strong><br />
                  <small
                    >Dapat membuka dan menggunakan menu penilaian APD.</small
                  >
                </span>
              </label>

              <!-- LAPORAN -->
              <label>
                <input type="checkbox" data-permission="accessKpiReport" />
                <span>
                  <strong>Akses Laporan KPI Saja</strong><br />
                  <small>Dapat membuka laporan KPI.</small>
                </span>
              </label>

              <label
                ><input
                  type="checkbox"
                  data-permission="accessKpiFillingReport"
                /><span
                  ><strong>Akses Laporan KPI Filling</strong><br /><small
                    >Dapat melihat KPI Filling.</small
                  ></span
                ></label
              >
              <label
                ><input
                  type="checkbox"
                  data-permission="accessKpiPressReport"
                /><span
                  ><strong>Akses Laporan KPI Press</strong><br /><small
                    >Dapat melihat KPI Press.</small
                  ></span
                ></label
              >
              <label
                ><input
                  type="checkbox"
                  data-permission="accessWorkReport"
                /><span
                  ><strong>Akses Laporan Hasil Pengerjaan Saja</strong
                  ><br /><small
                    >Dapat membuka laporan hasil pengerjaan.</small
                  ></span
                ></label
              >

              <!-- HAPUS SISA PRESS -->
              <label>
                <input type="checkbox" data-permission="deleteUnpressed" />
                <span>
                  <strong>Hapus Sisa Press</strong><br />
                  <small
                    >Dapat menutup atau menghapus sisa pengerjaan Press.</small
                  >
                </span>
              </label>

              <!-- LIHAT SEMUA DATA -->
              <label>
                <input type="checkbox" data-permission="viewAllData" />
                <span>
                  <strong>Lihat Semua Data</strong><br />
                  <small>Dapat melihat data produksi milik semua user.</small>
                </span>
              </label>

              <!-- EDIT DATA SENDIRI -->
              <label>
                <input type="checkbox" data-permission="editOwn" />
                <span>
                  <strong>Edit Data Sendiri</strong><br />
                  <small>Dapat mengubah data yang dibuat sendiri.</small>
                </span>
              </label>

              <!-- EDIT DATA USER LAIN -->
              <label>
                <input type="checkbox" data-permission="editOthers" />
                <span>
                  <strong>Edit Data User Lain</strong><br />
                  <small>Dapat mengubah data yang dibuat user lain.</small>
                </span>
              </label>

              <!-- HAPUS DATA SENDIRI -->
              <label>
                <input type="checkbox" data-permission="deleteOwn" />
                <span>
                  <strong>Hapus Data Sendiri</strong><br />
                  <small>Dapat menghapus data yang dibuat sendiri.</small>
                </span>
              </label>

              <!-- HAPUS DATA USER LAIN -->
              <label>
                <input type="checkbox" data-permission="deleteOthers" />
                <span>
                  <strong>Hapus Data User Lain</strong><br />
                  <small>Dapat menghapus data milik user lain.</small>
                </span>
              </label>

              <!-- SETTING -->
              <label>
                <input type="checkbox" data-permission="accessMaster" />
                <span>
                  <strong>Akses Setting Data Master (Sumber Search)</strong
                  ><br />
                  <small>Dapat mengelola sumber pencarian.</small>
                </span>
              </label>
              <label
                ><input
                  type="checkbox"
                  data-permission="accessKpiSettings"
                /><span
                  ><strong>Akses Pengaturan KPI</strong><br /><small
                    >Dapat mengatur target KPI.</small
                  ></span
                ></label
              >
            </div>

            <div class="form-actions permission-actions">
              <button
                type="button"
                class="btn btn-ghost"
                onclick="document.getElementById('permissionClose').click()"
              >
                Batal
              </button>

              <button type="button" class="btn btn-primary" id="permissionSave">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                Simpan
              </button>
            </div>
          </div>
        </div>
